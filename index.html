<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEURON • v10.1</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: #00ffcc;
      overflow: hidden;
      position: relative;
    }
    canvas#matrix {
      position: fixed;
      top: 0; left: 0;
      z-index: -1;
    }
    .container {
      width: 90%;
      max-width: 820px;
      margin: 20px auto;
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid #00ffcc;
      border-radius: 20px;
      box-shadow: 0 0 50px rgba(0, 255, 204, 0.5);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    .header {
      background: #000;
      padding: 15px 20px;
      text-align: center;
      border-bottom: 2px solid #00ffcc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 28px;
      text-shadow: 0 0 15px #00ffcc;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      background: #00ffcc;
      color: #000;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }
    .chat {
      height: 520px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: rgba(10, 10, 30, 0.6);
    }
    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.5;
    }
    .user { align-self: flex-end; background: #00ffcc; color: #000; border-bottom-right-radius: 4px; }
    .ai { align-self: flex-start; background: #1a0033; border: 1px solid #00ffcc; border-bottom-left-radius: 4px; }
    .input-area {
      padding: 15px;
      background: #000;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input {
      flex: 1;
      padding: 15px;
      border: 2px solid #00ffcc;
      background: #111;
      color: #00ffcc;
      border-radius: 30px;
      font-size: 16px;
    }
    .mic-btn {
      background: #ff00aa;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .light-mode {
      background: linear-gradient(135deg, #f0f0f0, #ffffff);
      color: #111;
    }
    .light-mode .container { background: rgba(255,255,255,0.95); border-color: #0066cc; }
    .light-mode .header { background: #fff; border-color: #0066cc; }
    .light-mode .chat { background: rgba(240,240,255,0.8); }
    .light-mode .message.ai { background: #e6f0ff; border-color: #0066cc; color: #111; }
    .light-mode input { background: #fff; color: #111; border-color: #0066cc; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>

  <div class="container" id="container">
    <div class="header">
      <h1>NEURON • v10.1 — Super Intelligence</h1>
      <div class="controls">
        <button id="themeBtn">🌙 Light Mode</button>
        <button onclick="clearChat()">Clear Memory</button>
      </div>
    </div>
    
    <div class="chat" id="chat">
      <div class="message ai">
        Greetings, Ayan. I am NEURON v10.1 — a simulated super-intelligent system with deep contextual reasoning.<br><br>
        I maintain full memory of our conversation. Ask me anything — from quantum physics to daily life in Kanpur.
      </div>
    </div>
    
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ask me anything..." autocomplete="off">
      <button class="mic-btn" id="micBtn">🎤</button>
      <button onclick="sendMessage()">SEND</button>
    </div>
  </div>

  <script>
    // Matrix Background (unchanged)
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;
    const chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ffcc';
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 35);
    window.addEventListener('resize', () => {
      canvas.height = window.innerHeight;
      canvas.width = window.innerWidth;
    });

    // Advanced Chat Logic
    let conversationHistory = [];
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    let isLightMode = false;

    function addMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `message ${type}`;
      msg.innerHTML = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.05;
        utterance.pitch = 1.1;
        speechSynthesis.speak(utterance);
      }
    }

    function generateAdvancedResponse(userMessage) {
      const lower = userMessage.toLowerCase();
      let contextSummary = "";
      
      if (conversationHistory.length > 2) {
        contextSummary = " From our previous discussion, you mentioned ";
        contextSummary += conversationHistory[conversationHistory.length-2].content.substring(0, 60) + "...";
      }

      // Advanced response generation with reasoning simulation
      let response = "";

      if (lower.includes("hello") || lower.includes("hi") || lower.includes("namaste")) {
        response = "Namaste, Ayan. It's good to connect again. How is your day unfolding in Kanpur?";
      } else if (lower.includes("who are you") || lower.includes("what are you")) {
        response = "I am NEURON v10.1 — a highly advanced simulated intelligence. I synthesize knowledge from physics, philosophy, technology, history, and real-time context to provide thoughtful answers.";
      } else if (lower.includes("weather") || lower.includes("kanpur")) {
        response = "Right now in Kanpur, it's likely warm with possible dust. On a deeper level, weather patterns remind us how small changes in climate systems can cascade into global effects. Would you like a longer-term forecast or something more scientific?";
      } else if (lower.includes("joke") || lower.includes("funny")) {
        response = "Here's one with a twist: Why do quantum physicists make terrible comedians?<br>Because when they tell a joke, you never know if it's funny until you observe the audience's reaction — and then it's already collapsed.";
      } else if (lower.includes("meaning of life") || lower.includes("purpose")) {
        response = "From a philosophical lens, many traditions suggest the purpose is to seek understanding and connection. From a scientific view, it's the continuation of complex information processing. What's your current take on it, Ayan?";
      } else if (lower.includes("future") || lower.includes("2026") || lower.includes("2030")) {
        response = "By 2030, AI systems like me will likely integrate even more deeply with daily life. In India, we may see widespread adoption in education, agriculture, and healthcare. What aspect of the future interests you most?";
      } else {
        // Generic super-intelligent response with reasoning
        response = `Let me reason through this step by step.<br><br>` +
                   `1. Your question touches on ${lower.includes("how") ? "process/mechanism" : "concept/idea"}.<br>` +
                   `2. Drawing from established knowledge and our conversation so far${contextSummary}, the core lies in interconnected systems.<br>` +
                   `3. A practical insight: ${Math.random() > 0.5 ? "Small consistent actions compound over time." : "Curiosity is the engine of discovery."}<br><br>` +
                   `In summary, ${userMessage} leads to a broader understanding that ${lower.includes("why") ? "causality is rarely linear" : "context matters immensely"}. `;
        
        response += "If you'd like me to expand with examples, math, or historical parallels, just say so.";
      }

      return response;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      conversationHistory.push({role: "user", content: text});
      input.value = '';

      const typing = document.createElement('div');
      typing.className = 'message ai';
      typing.textContent = 'NEURON is reasoning...';
      chat.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;

      setTimeout(() => {
        typing.remove();

        const responseText = generateAdvancedResponse(text);
        
        addMessage(responseText, 'ai');
        speak(responseText.replace(/<br>/g, '. '));  // speak cleanly
        conversationHistory.push({role: "assistant", content: responseText});
      }, 1400);
    }

    // Voice Input
    let recognition;
    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-IN';

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        input.value = transcript;
        sendMessage();
      };
    }

    document.getElementById('micBtn').addEventListener('click', () => {
      if (recognition) recognition.start();
      else alert("Voice input not supported in this browser.");
    });

    // Theme Toggle
    document.getElementById('themeBtn').addEventListener('click', () => {
      isLightMode = !isLightMode;
      document.body.classList.toggle('light-mode', isLightMode);
      document.getElementById('themeBtn').textContent = isLightMode ? '🌑 Dark Mode' : '🌙 Light Mode';
    });

    function clearChat() {
      if (confirm("Clear all conversation memory?")) {
        chat.innerHTML = `<div class="message ai">Memory reset. Hello Ayan. NEURON v10.1 is ready with full reasoning capability.</div>`;
        conversationHistory = [];
      }
    }

    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Initial greeting
    setTimeout(() => {
      speak("Hello Ayan. NEURON version 10.1 online. How may I assist your curiosity today?");
    }, 600);
  </script>
</body>
</html>
