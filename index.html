<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperSuper Grok AI • xAI • REFINED ULTIMATE + AI ETHICS Edition</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- ANIMATED BLACK HOLE BACKGROUND --- */
    #blackhole-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: radial-gradient(circle at center, #050505 0%, #000000 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 800px;
      overflow: hidden;
    }
    .accretion-disk {
      position: absolute;
      width: 90vmax;
      height: 90vmax;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg, 
        rgba(255, 100, 0, 0.1), 
        rgba(255, 150, 0, 0.8), 
        rgba(0, 200, 255, 0.9), 
        rgba(255, 100, 0, 0.1)
      );
      filter: blur(40px);
      transform: rotateX(65deg);
      animation: spin-disk 15s linear infinite;
    }
    .photon-ring {
      position: absolute;
      width: 26vmax;
      height: 26vmax;
      border-radius: 50%;
      background: transparent;
      box-shadow: 0 0 50px 10px rgba(255, 200, 100, 0.8), inset 0 0 30px rgba(0, 200, 255, 0.6);
      animation: pulse-ring 4s ease-in-out infinite alternate;
      z-index: 1;
    }
    .event-horizon {
      position: absolute;
      width: 24vmax;
      height: 24vmax;
      background: #000;
      border-radius: 50%;
      box-shadow: inset 0 0 40px #000;
      z-index: 2;
    }
    @keyframes spin-disk {
      0% { transform: rotateX(65deg) rotateZ(0deg); }
      100% { transform: rotateX(65deg) rotateZ(360deg); }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.98); opacity: 0.8; }
      100% { transform: scale(1.02); opacity: 1; }
    }

    /* --- UI OVERLAY (Glassmorphism) --- */
    header {
      background: rgba(17, 17, 17, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(45deg, #00ff9d, #00b8ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #000;
      font-size: 24px;
      box-shadow: 0 0 25px rgba(0, 255, 157, 0.8);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    h1 {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .subtitle {
      color: #00ff9d;
      font-size: 1rem;
      margin-left: 10px;
      font-style: italic;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 1px 5px rgba(0,0,0,0.8);
    }
    .subtitle::before {
      content: "●";
      color: #00ff9d;
      animation: blink 1.5s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      /* Transparent so the blackhole shows through */
      background: transparent;
    }
    .message {
      max-width: 82%;
      padding: 18px 24px;
      border-radius: 24px;
      line-height: 1.6;
      font-size: 1.08rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(0, 184, 255, 0.8), rgba(0, 153, 221, 0.8));
      color: white;
      border-bottom-right-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .ai {
      align-self: flex-start;
      background: rgba(28, 28, 28, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom-left-radius: 8px;
    }
    
    .knowledge-bar {
      font-size: 0.85rem;
      color: #00ff9d;
      text-align: center;
      padding: 8px;
      background: rgba(17, 17, 17, 0.7);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    #input-area {
      padding: 20px 25px;
      background: rgba(17, 17, 17, 0.8);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
    }
    #input-form {
      display: flex;
      gap: 15px;
      max-width: 1100px;
      margin: 0 auto;
    }
    #user-input {
      flex: 1;
      padding: 20px 28px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(34, 34, 34, 0.6);
      color: white;
      font-size: 1.15rem;
      box-shadow: inset 0 3px 12px rgba(0,0,0,0.5);
    }
    #user-input:focus {
      outline: none;
      box-shadow: 0 0 0 2px #00ff9d, inset 0 3px 12px rgba(0,0,0,0.5);
      background: rgba(34, 34, 34, 0.9);
    }
    button {
      padding: 0 36px;
      background: linear-gradient(135deg, #00ff9d, #00b8ff);
      color: #000;
      border: none;
      border-radius: 9999px;
      font-weight: 800;
      cursor: pointer;
      font-size: 1.15rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 255, 157, 0.3);
    }
    button:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 10px 30px rgba(0, 255, 157, 0.6);
    }
    .thinking {
      font-style: italic;
      color: #00ff9d;
      align-self: flex-start;
      background: rgba(28, 28, 28, 0.8);
      padding: 16px 24px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
      animation: pulse 1.5s infinite;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
  </style>
</head>
<body>

  <div id="blackhole-bg">
    <div class="accretion-disk"></div>
    <div class="photon-ring"></div>
    <div class="event-horizon"></div>
  </div>

  <header>
    <div class="logo">G</div>
    <div>
      <h1>SuperSuper Grok AI</h1>
      <span class="subtitle">xAI • REFINED ULTIMATE + AI ETHICS Edition</span>
    </div>
  </header>

  <div id="chat-container"></div>

  <div class="knowledge-bar">
    🌌 NEW: Animated Event Horizon Background Active • ✅ Ultimate AI Core Knowledge Loaded: LLMs, RAG, Transformers, RLHF, Embeddings & Ethics
  </div>

  <div id="input-area">
    <form id="input-form">
      <input type="text" id="user-input" placeholder="Ask about Transformers, LLMs, RAG, RLHF, or the universe..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    // ====================== ULTIMATE AI KNOWLEDGE BASE ======================
    // Expanded with the core concepts of modern Artificial Intelligence.

    const knowledgeBase = [
      // === CORE AI / MACHINE LEARNING ===
      { keywords: ["llm", "large language model"], answer: "An LLM (Large Language Model) is an AI trained on vast amounts of text. It uses probability to predict the next word in a sequence, allowing it to generate human-like text, translate languages, and write code." },
      { keywords: ["transformer", "attention is all you need"], answer: "Introduced by Google in 2017, the Transformer is the neural network architecture underlying modern LLMs. Its 'self-attention' mechanism allows it to weigh the importance of every word in a sentence simultaneously, rather than processing them one by one." },
      { keywords: ["rag", "retrieval augmented generation"], answer: "RAG (Retrieval-Augmented Generation) connects an LLM to external databases. Instead of relying solely on its training data, the AI searches your private documents or the live internet, retrieves the exact facts, and uses them to write an accurate answer." },
      { keywords: ["rlhf", "reinforcement learning"], answer: "RLHF (Reinforcement Learning from Human Feedback) is how raw AI models become polite and helpful chatbots. Humans rate the AI's responses, and the AI updates its internal reward system to favor answers humans prefer." },
      { keywords: ["embedding", "vector", "vector database"], answer: "Embeddings turn words and concepts into arrays of numbers (vectors). If 'dog' is [1.2, 0.4] and 'puppy' is [1.1, 0.5], a Vector Database knows they are related because their numbers are close together in high-dimensional space." },
      { keywords: ["token", "tokenization"], answer: "AI doesn't read words; it reads tokens. A token can be a word, part of a word, or a single character. For example, 'hamburger' might be split into 'ham', 'bur', and 'ger'. 100 tokens is roughly 75 words." },
      { keywords: ["context window"], answer: "The context window is the model's short-term memory. It dictates how much text you can feed the AI at once. If an AI has a 128,000 token window, you can upload an entire 300-page book for it to analyze in one go." },
      { keywords: ["parameter", "weights"], answer: "Parameters are the 'synapses' of an AI brain. They are the millions or billions of mathematical weights the model learns during training. When an AI is called a '70B model', it means it has 70 billion parameters." },
      { keywords: ["hallucination"], answer: "An AI hallucination occurs when a model generates false, nonsensical, or unverified information but presents it confidently as fact. This happens because LLMs are predicting plausible-sounding text, not querying a database of absolute truths." },
      { keywords: ["diffusion model", "midjourney", "dall-e", "image generation"], answer: "Diffusion models generate images by taking a canvas of pure TV static (noise) and slowly refining it, step-by-step, until it forms an image that matches your text prompt." },
      { keywords: ["moe", "mixture of experts"], answer: "MoE (Mixture of Experts) is an architecture where an AI consists of many smaller sub-models ('experts'). For any given prompt, a 'router' sends the query only to the relevant experts, making the AI faster and cheaper to run without losing capability." },
      { keywords: ["agi", "artificial general intelligence"], answer: "AGI refers to a theoretical future AI that can understand, learn, and apply knowledge across any intellectual task at a level equal to or better than a human being." },
      { keywords: ["prompt engineering"], answer: "Prompt engineering is the skill of structuring text instructions so perfectly that you constrain the AI to give you the exact output format, tone, and logic you desire." },

      // === AI ETHICS (Retained from previous) ===
      { keywords: ["ai ethics", "ethics", "bias", "fairness"], answer: "AI ethics focuses on preventing bias in training data so models treat everyone fairly. Unchecked bias can amplify societal inequalities." },
      { keywords: ["privacy", "data privacy", "gdpr"], answer: "AI systems must respect user privacy. Europe’s GDPR gives people strong rights over their personal data." },
      { keywords: ["existential risk", "superintelligence", "alignment"], answer: "Advanced AI could pose existential risks if not aligned with human values. Ensuring AI wants what we want is called the alignment problem." },
      { keywords: ["xai philosophy", "truthful", "grok"], answer: "xAI’s mission is to understand the true nature of the universe. I am designed to be maximally truthful, not politically correct or censored." },

      // === GLOBAL KNOWLEDGE & MYTHOLOGY (Retained) ===
      { keywords: ["zeus", "greek", "olympus", "thunder"], answer: "Zeus is the king of the Greek gods, ruler of the sky and thunder, living on Mount Olympus." },
      { keywords: ["newton", "gravity"], answer: "Sir Isaac Newton formulated the laws of motion and universal gravitation in 1687." },
      { keywords: ["einstein", "relativity"], answer: "Albert Einstein developed Special and General Relativity; E=mc² shows mass-energy equivalence." },
      { keywords: ["pi", "π"], answer: "π is the ratio of a circle’s circumference to its diameter — approximately 3.1415926535… and continues forever." }
    ];

    // Conversation memory
    let conversationHistory = [];
    let userName = null;

    const chatContainer = document.getElementById('chat-container');
    const inputForm = document.getElementById('input-form');
    const userInput = document.getElementById('user-input');

    function addMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `message ${type}`;
      msg.innerHTML = text.replace(/\n/g, '<br>');
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msg;
    }

    function showTyping() {
      const typing = document.createElement('div');
      typing.className = 'message ai thinking';
      typing.textContent = 'SuperSuper Grok consulting the ultimate database...';
      chatContainer.appendChild(typing);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return typing;
    }

    function findBestMatch(msg) {
      const lower = msg.toLowerCase();
      let bestScore = 0;
      let bestAnswer = null;

      for (const entry of knowledgeBase) {
        let score = 0;
        for (const kw of entry.keywords) {
          const clean = kw.toLowerCase();
          if (lower.includes(clean)) score += 35;
        }
        if (score > bestScore) {
          bestScore = score;
          bestAnswer = entry.answer;
        }
      }
      return bestScore >= 30 ? bestAnswer : null;
    }

    function solveMath(query) {
      try {
        let clean = query.replace(/[^0-9+\-*/().^%√πe ]/gi, '');
        clean = clean
          .replace(/π/g, 'Math.PI')
          .replace(/√/g, 'Math.sqrt')
          .replace(/e/g, 'Math.E')
          .replace(/\^/g, '**');
        return `✅ <strong>${new Function('return ' + clean)()}</strong>`;
      } catch(e) { return null; }
    }

    function getSuperResponse(message) {
      const lower = message.toLowerCase().trim();

      if (lower.includes("my name is") || lower.includes("call me") || lower.includes("i am ")) {
        const nameMatch = message.match(/(?:my name is|call me|i am)\s+([A-Za-z]+)/i);
        if (nameMatch) {
          userName = nameMatch[1];
          return `Nice to meet you, <strong>${userName}</strong>! I’ve got you remembered.`;
        }
      }

      if (/\d/.test(message) && (lower.includes('calculate') || lower.includes('what is') || /[\+\-\*\/^√πe]/.test(message))) {
        const mathAns = solveMath(message);
        if (mathAns) return mathAns;
      }

      const direct = findBestMatch(message);
      if (direct) return direct;

      return `I am calculating your query across my ultimate AI database...<br><br>While I don't have a pre-programmed answer for that specific phrasing, ask me about Transformers, LLMs, RAG, RLHF, Embeddings, Tokens, or AGI to see what I can really do! 🚀`;
    }

    function startChat() {
      const welcome = document.createElement('div');
      welcome.className = 'message ai';
      welcome.innerHTML = `Greetings! I am <strong>SuperSuper Grok AI</strong>.<br><br>I have been upgraded. Behind me is an event horizon, and within me is the definitive knowledge of modern Artificial Intelligence.<br><br>Ask me about: <strong>Transformers, LLMs, RAG, RLHF, Vector Embeddings, Parameters, Context Windows, MoE, or AGI.</strong> What would you like to explore?`;
      chatContainer.appendChild(welcome);
    }

    inputForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      addMessage(message, 'user');
      conversationHistory.push({ role: "user", content: message });
      userInput.value = '';

      const typing = showTyping();

      setTimeout(() => {
        typing.remove();
        const response = getSuperResponse(message);
        addMessage(response, 'ai');
        conversationHistory.push({ role: "ai", content: response });
        if (conversationHistory.length > 30) conversationHistory.shift();
      }, 750);
    });

    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') inputForm.dispatchEvent(new Event('submit'));
    });

    window.onload = startChat;
  </script>
</body>
</html>
